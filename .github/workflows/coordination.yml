name: Coordination regression gate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bun install --frozen-lockfile
      - run: bun scripts/verify-coordination.ts
      - run: npm run verify:package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coordination-${{ matrix.os }}
          path: dist/verification/coordination
